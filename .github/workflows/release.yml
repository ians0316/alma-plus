# Makes a GitHub release with a ready-to-load zip whenever the version in
# manifest.json goes up. Release titles are just the version, like v2.12.0.
name: Release

on:
  push:
    branches: [main]
    paths: [manifest.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: echo "tag=v$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            mkdir -p dist/alma-plus
            rsync -a --exclude .git --exclude .github --exclude dist --exclude layout/screenshots ./ dist/alma-plus/
            (cd dist && zip -qr "alma-plus-$TAG.zip" alma-plus)
            gh release create "$TAG" "dist/alma-plus-$TAG.zip" \
              --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
          # keep every release title as just its version
          gh release list --limit 100 --json tagName,name \
            -q '.[] | select(.name != .tagName) | .tagName' |
            while read -r t; do gh release edit "$t" --title "$t"; done
