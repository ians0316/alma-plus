# Makes a GitHub release with a ready-to-load zip whenever the version in
# manifest.json goes up.
name: Release

on:
  push:
    branches: [main]
    paths: [manifest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: echo "tag=v$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released"; exit 0
          fi
          mkdir -p dist/alma-plus
          rsync -a --exclude .git --exclude .github --exclude dist --exclude layout/screenshots ./ dist/alma-plus/
          (cd dist && zip -qr "alma-plus-$TAG.zip" alma-plus)
          gh release create "$TAG" "dist/alma-plus-$TAG.zip" \
            --target "$GITHUB_SHA" --title "Alma+ $TAG" --generate-notes
