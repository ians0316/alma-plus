# Makes a GitHub release with a ready-to-load zip whenever the version in
# manifest.json goes up. Release titles look like "Alma+ v2.12.0".
name: Release

on:
  push:
    branches: [main]
    paths: [manifest.json, .github/workflows/release.yml, .github/RELEASE_NOTES.md]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://github.com/ians0316/alma-plus/releases/latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: v
        run: echo "tag=v$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            mkdir -p dist/alma-plus
            rsync -a --exclude .git --exclude .github --exclude dist --exclude layout/screenshots --exclude ipad ./ dist/alma-plus/
            (cd dist && zip -qr "alma-plus-$TAG.zip" alma-plus)
            # Safari version (iPad, iPhone, Mac) for the Userscripts app
            python3 ipad/build_userscript.py
            cp ipad/alma-plus.user.js dist/alma-plus.user.js
            gh release create "$TAG" "dist/alma-plus-$TAG.zip" dist/alma-plus.user.js \
              --target "$GITHUB_SHA" --title "Alma+ $TAG" --notes-file .github/RELEASE_NOTES.md --generate-notes
          else
            # notes were updated for the current version
            gh release edit "$TAG" --notes-file .github/RELEASE_NOTES.md
          fi
          # keep every release title as "Alma+ <version>"
          gh release list --limit 100 --json tagName,name \
            -q '.[] | select(.name != ("Alma+ " + .tagName)) | .tagName' |
            while read -r t; do gh release edit "$t" --title "Alma+ $t"; done
