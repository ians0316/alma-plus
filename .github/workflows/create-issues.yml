# One-time: posts more starter issues, then this file is deleted.
name: Create starter issues
on:
  push:
    branches: [main]
    paths: [.github/workflows/create-issues.yml]
permissions:
  issues: write
jobs:
  issues:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          make() {
            if gh issue list --state all --limit 200 --json title -q ".[].title" | grep -Fxq "$1"; then
              echo "exists: $1"; return; fi
            gh issue create --title "$1" --label "$2" --body "$3"
          }
          make "Keyboard shortcut to add a task" "good first issue" "Press **N** on the To Do page to open the + Add my own task window (not while typing in a text field)."
          make "Pin important tasks to the top" "enhancement" "A pin button on your own tasks that keeps them at the top of Upcoming Assignments until unpinned."
          make "This week view" "enhancement" "A view on the To Do page that groups everything due this week by day (Mon, Tue, ...), in Alma's style."
          make "Study timer on assignments" "enhancement" "A small 25-minute focus timer you can start from an assignment or task popup, with a sound when it ends."
          make "New version notice in the settings menu" "good first issue" "Compare the installed version with the latest GitHub release and show a short *New version available* line with a link."
          make "Repeating tasks" "enhancement" "Let a task repeat every day or every week (for example, weekly vocab quiz), creating the next one when the current one is done."
          make "Priority colors on task rows" "good first issue" "Show a small colored dot for high/medium/low priority next to your own tasks on the To Do page."
          make "Export tasks as a spreadsheet (CSV)" "good first issue" "A button next to Back up tasks that downloads tasks as a .csv file that opens in Excel or Google Sheets."
          make "Overdue count in the sidebar" "enhancement" "Show a small number on the Assignments tab in the sidebar for your own tasks that are past due and not done."
          make "Add a Troubleshooting section to the README" "documentation,good first issue" "Common fixes: broken icons (click reload in chrome://extensions), tasks missing after moving the folder, features not showing on parent/teacher accounts."
