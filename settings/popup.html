<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Alma+ Custom Tasks</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../layout/icons/icon32.png" alt="" width="20" height="20">
    <span>Alma+ Custom Tasks</span>
  </header>

  <main>
    <section>
      <h2>Overview &amp; Calendar</h2>
      <label class="setting">
        <span class="text"><strong>Today dashboard</strong><small>Due Today, Due Tomorrow, Recently Updated Grades, and New &amp; Updated Assignments under your schedule</small></span>
        <input type="checkbox" data-setting="dashboard"><span class="switch" aria-hidden="true"></span>
      </label>
      <label class="setting">
        <span class="text"><strong>Calendar</strong><small>Your assignments, tasks, and the official school calendar on Alma's Calendar page</small></span>
        <input type="checkbox" data-setting="calendar"><span class="switch" aria-hidden="true"></span>
      </label>
      <label class="setting">
        <span class="text"><strong>Extra tabs</strong><small>My Classes, Assignments, Attendance, and Report Cards in the left menu; Announcements, My Info, Calendar, and Directory in the small tabs</small></span>
        <input type="checkbox" data-setting="sidebarTabs"><span class="switch" aria-hidden="true"></span>
      </label>
    </section>

    <section>
      <h2>Reminders</h2>
      <label class="setting">
        <span class="text"><strong>Night-before reminder</strong><small>A notification listing what's due tomorrow</small></span>
        <input type="checkbox" data-setting="reminder"><span class="switch" aria-hidden="true"></span>
      </label>
      <div class="reminder-time">
        <label for="reminder-time">Remind me at</label>
        <input type="time" id="reminder-time" value="20:00">
        <button type="button" id="test-reminder">Test</button>
      </div>
      <label class="setting">
        <span class="text"><strong>New grade alerts</strong><small>A notification when a teacher posts or changes a grade (checks every 30 minutes)</small></span>
        <input type="checkbox" data-setting="gradeAlerts"><span class="switch" aria-hidden="true"></span>
      </label>
      <div class="reminder-time">
        <label>Show my latest grade</label>
        <button type="button" id="test-grades">Test</button>
      </div>
    </section>

    <section>
      <h2>Your tasks</h2>
      <label class="setting">
        <span class="text"><strong>On the To Do page</strong><small>Your own tasks in Upcoming Assignments</small></span>
        <input type="checkbox" data-setting="tasksTodo"><span class="switch" aria-hidden="true"></span>
      </label>
      <label class="setting">
        <span class="text"><strong>On class pages</strong><small>Each class's tasks in its Upcoming list</small></span>
        <input type="checkbox" data-setting="tasksClass"><span class="switch" aria-hidden="true"></span>
      </label>
      <label class="setting">
        <span class="text"><strong>Extra buttons</strong><small>Export, Back up, Restore, and Show next to "+ Add my own task"</small></span>
        <input type="checkbox" data-setting="toolbarExtras"><span class="switch" aria-hidden="true"></span>
      </label>
    </section>

    <section>
      <h2>Assignments</h2>
      <label class="setting">
        <span class="text"><strong>Google Calendar button</strong><small>Add an assignment or task to Google Calendar</small></span>
        <input type="checkbox" data-setting="calendarButtons"><span class="switch" aria-hidden="true"></span>
      </label>
      <label class="setting">
        <span class="text"><strong>My notes</strong><small>Write your own notes on any assignment, in its popup</small></span>
        <input type="checkbox" data-setting="notes"><span class="switch" aria-hidden="true"></span>
      </label>
    </section>

    <section>
      <h2>Attached files</h2>
      <label class="setting">
        <span class="text"><strong>In popups</strong><small>Upload File, Add from Drive, Add Link in assignment and task popups</small></span>
        <input type="checkbox" data-setting="attachments"><span class="switch" aria-hidden="true"></span>
      </label>
      <label class="setting">
        <span class="text"><strong>Paperclip counts</strong><small>📎 on rows that have attached files</small></span>
        <input type="checkbox" data-setting="clips"><span class="switch" aria-hidden="true"></span>
      </label>
    </section>

    <section>
      <h2>Notion &amp; Google Calendar</h2>
      <label class="setting">
        <span class="text"><strong>Send my tasks</strong><small>Your tasks also show up in Notion and Google Calendar, through Alma Sync</small></span>
        <input type="checkbox" data-setting="syncTasks"><span class="switch" aria-hidden="true"></span>
      </label>
      <div class="sync-status">
        <span id="sync-status">&nbsp;</span>
        <button type="button" id="sync-now">Sync now</button>
      </div>
    </section>

    <p class="saved" id="saved" hidden>Saved. Alma reloaded with your changes.</p>
  </main>

  <footer>
    <span id="stats">&nbsp;</span>
    <span id="version"></span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
